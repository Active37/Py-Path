services:
  - type: web
    name: pypath
    runtime: python
    plan: free
    buildCommand: "python -m pip install -r requirements.txt && python manage.py collectstatic --no-input && DATABASE_URL=$DATABASE_URL_UNPOOLED python manage.py migrate --no-input && DATABASE_URL=$DATABASE_URL_UNPOOLED python manage.py bootstrap_admin && DATABASE_URL=$DATABASE_URL_UNPOOLED python manage.py seed_courses --missing-only"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile - --access-logformat '%(m)s %(U)s %(s)s %(L)s'"
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: AI_MODEL
        value: gemini-flash-latest
      - key: AI_API_TIMEOUT
        value: "60"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CODE_RUNNER_URL
        sync: false
      - key: CODE_RUNNER_API_KEY
        sync: false
      - key: CODE_RUNNER_LANGUAGE_ID
        value: "71"
      - key: CODE_RUNNER_JAVA_LANGUAGE_ID
        value: "62"
      - key: CODE_RUNNER_TIMEOUT
        value: "30"
